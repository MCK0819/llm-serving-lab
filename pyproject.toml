[project]
name = "llm-serving-lab"
version = "0.1.0"
description = "Self-hosted LLM serving backend with Korean document RAG"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141,<0.142",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<0.29",
    "uvicorn>=0.52,<0.53",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "psycopg[binary]>=3.3.5,<4",
    "alembic>=1.19.2,<2",
    "tzdata>=2026.3,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "pip-tools>=7.6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: needs external services", "gpu: needs a real GPU server", "load: load testing"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
