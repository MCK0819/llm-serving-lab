name: llm-lab-cpu

services:
  tei:
    image: ${LLM_LAB_TEI_IMAGE:?Provide the pinned image from models.env.example}
    profiles: [embedding]
    environment:
      HF_HUB_OFFLINE: ${LLM_LAB_MODELS_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${LLM_LAB_MODELS_OFFLINE:-0}
      HF_HUB_DISABLE_TELEMETRY: "1"
    command:
      - --model-id
      - ${LLM_LAB_EMBEDDING_MODEL:?Provide embedding model}
      - --revision
      - ${LLM_LAB_EMBEDDING_REVISION:?Provide immutable model revision}
      - --dtype
      - float32
      - --pooling
      - mean
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
      - --max-client-batch-size
      - "16"
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - tei-cache:/data
    networks: [backend]
    cpus: 2
    mem_limit: 2g
    restart: "no"

volumes:
  tei-cache:

networks:
  backend:
