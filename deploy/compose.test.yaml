name: llm-lab-auth-test

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: llm_lab_auth_test
      POSTGRES_USER: llm_lab_test
      POSTGRES_PASSWORD: ${LLM_LAB_TEST_DB_PASSWORD:?Set LLM_LAB_TEST_DB_PASSWORD to a generated test-only password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    networks:
      - auth-test

  test:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      LLM_LAB_DATABASE_URL: postgresql+psycopg://llm_lab_test:${LLM_LAB_TEST_DB_PASSWORD:?Set LLM_LAB_TEST_DB_PASSWORD to a generated test-only password}@postgres:5432/llm_lab_auth_test
      LLM_LAB_TEST_DATABASE_URL: postgresql+psycopg://llm_lab_test:${LLM_LAB_TEST_DB_PASSWORD:?Set LLM_LAB_TEST_DB_PASSWORD to a generated test-only password}@postgres:5432/llm_lab_auth_test
      MYPY_CACHE_DIR: /tmp/mypy-cache
      PYTEST_ADDOPTS: -p no:cacheprovider
    volumes:
      - ../:/srv/llm-serving-lab:ro
    networks:
      - auth-test

networks:
  auth-test:
    internal: true
